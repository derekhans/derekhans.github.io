---
layout: default
---
<a href="{{ '/' | relative_url }}" class="back-link">Back to index</a>

<article>
  <header>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
    <div class="tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="content">
    {{ content }}
  </div>
</article>
