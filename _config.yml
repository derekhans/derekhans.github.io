title: "Terminal Notes"
description: "Thoughts on systems, code, and craft"
author: "Anonymous"
email: ""
url: ""
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Pagination
paginate: 10
paginate_path: "/page/:num/"

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
